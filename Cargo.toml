[package]
name = "hap"
version = "0.1.0-pre.15"
authors = ["Elias Wilken <elias@wlkn.io>"]
edition = "2021"
description = "Rust implementation of the Apple HomeKit Accessory Protocol (HAP)"
documentation = "https://docs.rs/hap"
readme = "README.md"
repository = "https://github.com/ewilken/hap-rs"
license = "MIT/Apache-2.0"
keywords = ["apple", "homekit"]
exclude = [
    ".github",
    ".gitignore",
    "examples",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
]

[dependencies]
async-trait = "0.1.89"
byteorder = "1.5.0"
bytes = "1.11.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["std", "serde"] }
erased-serde = "0.4.9"
macaddr = { version = "1.0.1", features = ["serde"] }
futures = "0.3.32"
generic-array = { version = "1.3.5", features = ["compat-0_14"] }
get_if_addrs = "0.5.3"
hkdf = "0.11.0"
hyper = { version = "0.14.32", features = ["server", "http1"] }
libmdns = "0.10.1"
log = "0.4.29"
num = "0.4.3"
sha2 = "0.9.9"
signature = "2.2.0"
srp = "0.5.0"
thiserror = "2.0.18"
tokio = "1.49.0"
url = "2.5.8"
x25519-dalek = "2.0.1"
rand = "0.10.0"
uuid.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true

[dev-dependencies]
env_logger = "0.11.9"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time", "macros"] }

[workspace]
members = ["codegen"]

[workspace.dependencies]
handlebars = "6.4.0"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
